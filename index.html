<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A live Swiss railway clock built with D3.js." />
    <title>Swiss Railway Clock in D3.js | Daniel Pradilla</title>
    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #fffdf9;
      }

      main {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100vh;
      }

      .clock {
        display: block;
        width: min(100vw, 100vh, 500px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <main aria-label="Live Swiss railway clock showing your current local time">
      <div id="clock"></div>
      <noscript>This clock requires JavaScript to show the current time.</noscript>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="d3clock.js"></script>
    <script>
      d3clock({ target: "#clock", face: "sbb", width: 1000 });

      const clock = document.querySelector("svg.clock");
      clock.setAttribute("viewBox", "0 0 500 500");
      clock.setAttribute("width", "500");
      clock.setAttribute("height", "500");
    </script>
  </body>
</html>
