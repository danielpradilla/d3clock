<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Three live analog clock faces built with D3.js." />
    <title>D3.js Clock Faces | Daniel Pradilla</title>
    <style>
      :root {
        --page: #fffdf9;
        --ink: #000;
        --muted: #5f6368;
        --rule: #d1d1d1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--page);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 300;
      }

      main {
        width: min(1120px, calc(100% - 48px));
        min-height: 100vh;
        margin: auto;
        padding: 56px 0 40px;
      }

      .intro {
        margin-bottom: 48px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.4rem, 7vw, 4.8rem);
        font-weight: 300;
        line-height: 1;
      }

      .intro p,
      .clock-example p {
        margin: 0;
        color: var(--muted);
      }

      .clock-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 40px;
      }

      .clock-example {
        min-width: 0;
        text-align: center;
      }

      .clock {
        display: block;
        width: 100%;
        height: auto;
      }

      h2 {
        margin: 20px 0 6px;
        font-size: 1.35rem;
        font-weight: 300;
      }

      .site-links {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-top: 56px;
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }

      a {
        color: inherit;
        text-underline-offset: 0.18em;
      }

      a:focus-visible {
        outline: 2px solid rgba(47, 95, 127, 0.45);
        outline-offset: 4px;
      }

      @media (max-width: 760px) and (min-height: 401px) {
        main {
          width: min(100% - 32px, 500px);
          padding-top: 40px;
        }

        .clock-grid {
          grid-template-columns: 1fr;
          gap: 52px;
        }
      }

      @media (max-height: 400px) {
        main {
          display: grid;
          place-items: center;
          width: 100%;
          padding: 0 16px;
        }

        .intro,
        .clock-example h2,
        .clock-example p,
        .site-links,
        noscript {
          display: none;
        }

        .clock-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
          width: min(100%, 720px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <h1>D3.js clock faces</h1>
        <p>Three variations, all showing your current local time.</p>
      </header>

      <div class="clock-grid" aria-label="Live analog clock variations">
        <section class="clock-example">
          <div id="sbb-clock"></div>
          <h2>Swiss railway</h2>
          <p>The classic SBB face.</p>
        </section>
        <section class="clock-example">
          <div id="modern-clock"></div>
          <h2>Modern</h2>
          <p>A minimal contemporary face.</p>
        </section>
        <section class="clock-example">
          <div id="braun-clock"></div>
          <h2>Braun</h2>
          <p>Inspired by the Braun BN0021.</p>
        </section>
      </div>

      <noscript>This page requires JavaScript to show the current time.</noscript>

      <nav class="site-links" aria-label="Related links">
        <a href="/projects/">Projects</a>
        <a href="https://github.com/danielpradilla/d3clock">GitHub source</a>
      </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="d3clock.js"></script>
    <script>
      [
        ["#sbb-clock", "sbb"],
        ["#modern-clock", "modern"],
        ["#braun-clock", "braun"]
      ].forEach(([target, face]) => {
        d3clock({ target, face, width: 1000 });
        const clock = document.querySelector(`${target} svg.clock`);
        clock.setAttribute("viewBox", "0 0 500 500");
        clock.setAttribute("width", "500");
        clock.setAttribute("height", "500");
      });

      console.assert(document.querySelectorAll("svg.clock").length === 3, "Expected three clock faces");
    </script>
  </body>
</html>
